{% extends 'store/header.html' %}

{% block title %}Register | MediStore{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
    }
    
    .auth-card {
        background: white;
        border-radius: 30px;
        padding: 40px 35px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        max-width: 500px;
        width: 100%;
        border: 1px solid #e5e7eb;
    }
    
    .auth-card .auth-header {
        text-align: center;
        margin-bottom: 25px;
    }
    
    .auth-card .auth-header .logo {
        font-size: 2.5rem;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        width: 65px;
        height: 65px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        color: white;
    }
    
    .auth-card .auth-header h4 {
        font-weight: 800;
        color: #0f172a;
    }
    
    .auth-card .auth-header p {
        color: #64748b;
        font-size: 0.95rem;
    }
    
    .auth-card .form-control {
        border-radius: 14px;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        font-size: 0.95rem;
        transition: all 0.3s;
    }
    
    .auth-card .form-control:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
    }
    
    .auth-card .form-label {
        font-weight: 600;
        font-size: 0.9rem;
    }
    
    .auth-card .btn-auth {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        border: none;
        color: white;
        transition: all 0.3s;
    }
    
    .auth-card .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
    }
    
    .auth-card .auth-footer {
        text-align: center;
        margin-top: 20px;
        color: #64748b;
    }
    
    .auth-card .auth-footer a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }
    
    .auth-card .auth-footer a:hover {
        text-decoration: underline;
    }
    
    .error-text {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 5px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h4>Create Account</h4>
            <p>Join MediSupport for smart healthcare</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" 
                           placeholder="First name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" 
                           placeholder="Last name" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" 
                       placeholder="Choose a username" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" 
                       placeholder="Enter your email" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" 
                       placeholder="Enter your phone number">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password1" class="form-control" 
                       placeholder="Create a password" required>
                <small class="text-muted">At least 8 characters</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" 
                       placeholder="Confirm your password" required>
            </div>
            
            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                    I agree to the <a href="#" style="color: #2563eb;">Terms & Conditions</a>
                </label>
            </div>
            
            <button type="submit" class="btn-auth">
                <i class="fas fa-user-plus me-2"></i> Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{% url 'store:login' %}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
