{% extends 'store/header.html' %}

{% block title %}Login | Medisupport{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
    }
    
    .auth-card {
        background: white;
        border-radius: 30px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        max-width: 450px;
        width: 100%;
        border: 1px solid #e5e7eb;
    }
    
    .auth-card .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .auth-card .auth-header .logo {
        font-size: 3rem;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        width: 70px;
        height: 70px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        color: white;
    }
    
    .auth-card .auth-header h4 {
        font-weight: 800;
        color: #0f172a;
    }
    
    .auth-card .auth-header p {
        color: #64748b;
        font-size: 0.95rem;
    }
    
    .auth-card .form-control {
        border-radius: 14px;
        padding: 14px 18px;
        border: 2px solid #e5e7eb;
        font-size: 1rem;
        transition: all 0.3s;
    }
    
    .auth-card .form-control:focus {
        border-color: #06b6d4;
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
    }
    
    .auth-card .btn-auth {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        border: none;
        color: white;
        transition: all 0.3s;
    }
    
    .auth-card .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
    }
    
    .auth-card .auth-footer {
        text-align: center;
        margin-top: 20px;
        color: #64748b;
    }
    
    .auth-card .auth-footer a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }
    
    .auth-card .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-hospital"></i>
            </div>
            <h4>Welcome Back!</h4>
            <p>Login to your MediSupport account</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0" style="border-radius: 14px 0 0 14px;">
                        <i class="fas fa-user text-muted"></i>
                    </span>
                    <input type="text" name="username" class="form-control" 
                           placeholder="Enter your username" required style="border-left: none;">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0" style="border-radius: 14px 0 0 14px;">
                        <i class="fas fa-lock text-muted"></i>
                    </span>
                    <input type="password" name="password" class="form-control" 
                           placeholder="Enter your password" required style="border-left: none;">
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" style="color: #2563eb; text-decoration: none; font-size: 0.9rem;">
                    Forgot password?
                </a>
            </div>
            
            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'store:register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
