{% extends 'store/header.html' %}

{% block title %}Delete Address | MediStore{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-danger text-white rounded-4 rounded-bottom-0">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Delete Address</h5>
                </div>
                <div class="card-body p-4">
                    <p>Are you sure you want to delete this address?</p>
                    <div class="alert alert-warning">
                        <strong>{{ address.name }}</strong><br>
                        {{ address.get_full_address }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger rounded-pill px-4">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                        <a href="{% url 'store:address_list' %}" class="btn btn-secondary rounded-pill px-4">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
